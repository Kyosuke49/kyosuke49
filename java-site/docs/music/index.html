<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>曲置き場 — 偽造切手</title>
  <link rel="stylesheet" href="../style.css">
<style>
    /* ── トラック一覧 ── */
    .music-list {
      display: flex;
      flex-direction: column;
      gap: 2.2rem;
      margin: 1rem 0 2rem;
    }
    /* ── カード ── */
    .track-card {
      border: 1px solid var(--border);
      background: var(--white);
      overflow: hidden;
    }
    /* ── メディアエリア（音声: ジャケット、動画: video要素） ── */
    .player-media {
      background: #111;
      line-height: 0;
      position: relative;
    }
    .player-media-inner {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .player-jacket {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }
    .player-jacket-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0e0e0e, #1c1c1c);
    }
    .player-note {
      font-size: 4.5rem;
      color: rgba(255, 255, 255, 0.07);
      user-select: none;
      font-family: serif;
      line-height: 1;
    }
    .player-video {
      width: 100%;
      display: block;
    }
    /* ── コントロールバー ── */
    .player-controls {
      background: #0d0d0d;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.55rem 0.9rem;
      border-top: 1px solid #1e1e1e;
    }
    .player-play-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      padding: 0;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .player-play-btn:hover { background: rgba(255, 255, 255, 0.12); }
    /* シークバー */
    .player-seek-wrap {
      flex: 1;
      padding: 0.6rem 0;
      cursor: pointer;
    }
    .player-seek-track {
      height: 3px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      position: relative;
      transition: height 0.12s;
    }
    .player-seek-wrap:hover .player-seek-track,
    .player-seek-wrap.dragging .player-seek-track { height: 5px; }
    .player-fill {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 0%;
      background: #ffffff;
      border-radius: 2px;
      pointer-events: none;
    }
    .player-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 13px;
      height: 13px;
      background: #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s;
    }
    .player-seek-wrap:hover .player-thumb,
    .player-seek-wrap.dragging .player-thumb { opacity: 1; }
    .player-time {
      font-family: 'Geosans', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.55);
      white-space: nowrap;
      flex-shrink: 0;
      min-width: 7rem;
      text-align: right;
    }
    /* ── トラック情報 ── */
    .track-info {
      padding: 1rem 1.2rem 1.2rem;
    }
    .track-info-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.6rem;
      margin-bottom: 0.4rem;
    }
    .track-title {
      font-family: 'Geosans', sans-serif;
      font-weight: 400;
      font-size: 1rem;
      letter-spacing: 0.06em;
      color: var(--fg);
      margin: 0;
    }
    .track-date {
      font-family: 'Geosans', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .track-desc {
      font-family: 'Kazesawa', system-ui, sans-serif;
      font-weight: 300;
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.75;
      margin: 0 0 0.7rem;
    }
    .track-tags {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .track-tag {
      display: inline-block;
      font-family: 'Geosans', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.18rem 0.55rem;
    }
    /* ── 作品なしメッセージ ── */
    .music-empty {
      text-align: center;
      padding: 4rem 0;
      color: var(--muted);
      font-family: 'Kazesawa', system-ui, sans-serif;
      font-weight: 300;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
    }
    /* ── ページネーション（art/index.html と共通デザイン） ── */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 1rem 0 1.8rem;
    }
    .pagination-btn {
      background: none;
      border: 1px solid var(--border);
      padding: 0.38rem 1rem;
      cursor: pointer;
      color: var(--fg);
      font-family: 'Geosans', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .pagination-btn:hover:not(:disabled) {
      background: var(--black);
      color: var(--white);
      border-color: var(--black);
    }
    .pagination-btn:disabled { opacity: 0.28; cursor: default; }
    .pagination-nums { display: flex; gap: 0.3rem; }
    .pagination-num {
      background: none;
      border: 1px solid transparent;
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-family: 'Geosans', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      color: var(--muted);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .pagination-num:hover { color: var(--fg); border-color: var(--border); }
    .pagination-num.active {
      background: var(--black);
      color: var(--white);
      border-color: var(--black);
    }
  </style>
</head>
