<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バベルの司書 — 偽造切手</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .game-area {
      margin: 2rem 0;
      border-top: 1px solid var(--border);
      padding-top: 2rem;
    }

    /* ── WASM ステータス ── */
    .wasm-status {
      text-align: center;
      font-family: 'Geosans', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 0.6rem;
      min-height: 1.2em;
    }

    /* ── ステータスバー ── */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1.2rem;
      font-family: 'Geosans', sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      min-height: 1.4em;
    }
    .status-timer {
      font-size: 1.1rem;
      color: var(--fg);
      font-feature-settings: "tnum";
    }
    .status-timer.urgent { color: #c0392b; }
    .status-score { font-size: 1.1rem; color: var(--fg); }

    /* ── グリッド ── */
    .grid-wrapper {
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 3px;
      margin: 0 auto;
      max-width: 500px;
    }
    .cell {
      aspect-ratio: 1;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Geosans', sans-serif;
      font-size: clamp(0.75rem, 2.5vw, 1rem);
      letter-spacing: 0;
      color: var(--muted);
      cursor: default;
      transition: background 0.08s ease, color 0.08s ease,
                  border-color 0.08s ease, opacity 0.15s ease;
      position: relative;
    }
    .cell.active { color: var(--fg); }

    /*
      使用済みセル — 薄く表示するが pointer-events は残す。
      pointer-events: none にすると elementFromPoint() で検出できなくなり、
      なぞる指/カーソルが無効マスを「すり抜けて」先の有効マスに繋がるバグの原因となる。
      代わりに JS 側で usedCells フラグを見てトレースを即座に打ち切る。
    */
    .cell.used {
      opacity: 0.28;
    }

    .cell.traced {
      background: var(--black);
      color: var(--white);
      border-color: var(--black);
    }
    .cell.scored {
      animation: cellScore 0.45s ease forwards;
    }
    @keyframes cellScore {
      0%   { background: var(--black); color: var(--white); border-color: var(--black); }
      70%  { background: var(--black); color: var(--white); border-color: var(--black); }
      100% { background: transparent; color: var(--fg);    border-color: var(--border); }
    }

    /* ── カウントダウンオーバーレイ ── */
    .countdown-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(var(--bg-rgb, 255,255,255), 0.88);
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .countdown-overlay.visible { opacity: 1; pointer-events: all; }
    .countdown-number {
      font-family: 'Geosans', sans-serif;
      font-size: clamp(3rem, 15vw, 6rem);
      letter-spacing: 0.04em;
      color: var(--fg);
      animation: pulse 0.8s ease;
    }
    @keyframes pulse {
      0%   { transform: scale(1.3); opacity: 0; }
      40%  { transform: scale(1.0); opacity: 1; }
      100% { transform: scale(1.0); opacity: 1; }
    }

    /* ── ボタン列 ── */
    .btn-row {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      margin: 1.4rem 0 0;
    }
    .game-btn {
      background: none;
      border: 1px solid var(--black);
      font-family: 'Geosans', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      padding: 0.65rem 2.2rem;
      cursor: pointer;
      color: var(--fg);
      transition: background 0.15s ease, color 0.15s ease;
    }
    .game-btn:hover  { background: var(--black); color: var(--white); }
    .game-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .game-btn:disabled:hover { background: none; color: var(--fg); }

    /* ── 通知 ── */
    .notification-area {
      min-height: 3.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1rem;
    }
    .notification {
      font-family: 'Kazesawa', system-ui, sans-serif;
      font-weight: 300;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      border: 1px solid var(--border);
      padding: 0.5rem 1.2rem;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      text-align: center;
    }
    .notification.visible { opacity: 1; transform: translateY(0); }

    /* ── 結果オーバーレイ ── */
    .result-overlay {
      display: none;
      border: 1px solid var(--border);
      padding: 2.4rem 2rem;
      margin: 1.5rem auto 0;
      max-width: 420px;
      text-align: center;
      animation: fadeIn 0.35s ease;
    }
    .result-overlay.visible { display: block; }
    .result-label {
      font-family: 'Geosans', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    .result-score {
      font-family: 'Geosans', sans-serif;
      font-size: clamp(2.8rem, 10vw, 4.5rem);
      letter-spacing: 0.06em;
      line-height: 1;
      margin-bottom: 0.4rem;
    }
    .result-unit {
      font-family: 'Kazesawa', system-ui, sans-serif;
      font-weight: 300;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1.6rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }


    /* ============================================================
       BABEL ANOMALY EFFECT
       発動条件：ゲーム開始から40秒経過時点で0点
    ============================================================ */
    .game-area {
      transform-origin: center center;
      will-change: transform;
    }

    #anomaly-chromatic {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9996;
      opacity: 0;
      overflow: hidden;
      mix-blend-mode: screen;
      transition: opacity 0.1s linear;
    }

    #anomaly-chromatic::before,
    #anomaly-chromatic::after {
      content: '';
      position: absolute;
      inset: -8px;
      pointer-events: none;
      opacity: 0;
    }

    #anomaly-chromatic::before {
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255, 0, 0, 0.16) 0,
          rgba(255, 0, 0, 0.16) 1px,
          transparent 1px,
          transparent 7px
        );
      transform: translateX(-3px);
    }

    #anomaly-chromatic::after {
      background:
        repeating-linear-gradient(
          90deg,
          rgba(0, 255, 255, 0.16) 0,
          rgba(0, 255, 255, 0.16) 1px,
          transparent 1px,
          transparent 9px
        );
      transform: translateX(3px);
    }

    body.anomaly-active #anomaly-chromatic::before,
    body.anomaly-active #anomaly-chromatic::after {
      opacity: 0.65;
    }

    body.anomaly-critical #anomaly-chromatic::before {
      animation: anomaly-rgb-left 0.07s steps(2, jump-none) infinite;
      opacity: 0.9;
    }

    body.anomaly-critical #anomaly-chromatic::after {
      animation: anomaly-rgb-right 0.09s steps(2, jump-none) infinite;
      opacity: 0.9;
    }

    #moja-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 9997;
      opacity: 0;
      user-select: none;
    }

    #anomaly-noise-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
      overflow: hidden;
    }

    .anomaly-block {
      position: absolute;
      pointer-events: none;
      background: #000;
      mix-blend-mode: multiply;
    }

    .anomaly-line {
      position: absolute;
      left: -2%;
      width: 104%;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.45);
    }

    .anomaly-rgb-block {
      position: absolute;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    #anomaly-flash {
      position: fixed;
      inset: 0;
      background: #fcc;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
    }

    body.anomaly-critical {
      transform-origin: center top;
      will-change: transform;
    }

    @keyframes anomaly-rgb-left {
      0%   { transform: translateX(-4px); }
      50%  { transform: translateX(-12px); }
      100% { transform: translateX(-2px); }
    }

    @keyframes anomaly-rgb-right {
      0%   { transform: translateX(4px); }
      50%  { transform: translateX(13px); }
      100% { transform: translateX(2px); }
    }

    #fatal-error-overlay {
      position: fixed;
      inset: 0;
      z-index: 10001;
      display: none;
      align-items: center;
      justify-content: center;
      background: #eef;
      font-family: monospace;
      isolation: isolate;
    }

    #fatal-error-window {
      position: relative;
      z-index: 1;
    }

    #fatal-error-window {
      width: 280px;
      max-width: 78vw;
      background: #050505;
      color: #fff;
      border: 1px solid #fff;
      box-shadow: 6px 6px 0 rgba(0,0,0,0.7);
      font-family: monospace;
      font-size: 13px;
    }

    #fatal-error-titlebar {
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 0 6px;
      border-bottom: 1px solid #fff;
      background: #111;
      font-weight: bold;
    }

    #fatal-error-close {
      width: 20px;
      height: 18px;
      padding: 0;
      border: 1px solid #fff;
      background: #000;
      color: #fff;
      font-family: monospace;
      cursor: pointer;
      line-height: 15px;
    }

    #fatal-error-close:hover {
      background: #fff;
      color: #000;
    }

    #fatal-error-content {
      padding: 24px 20px;
      text-align: center;
      font-size: 14px;
      letter-spacing: 0.08em;
    }

  </style>
</head>
<body>
  <div id="shared-header"></div>

  <div class="container">
    <main class="sub-main">
      <h1 class="page-title font-kazesawa" data-i18n="title">バベルの司書</h1>

      <p class="font-kazesawa-light" style="font-size:0.9rem; color:var(--muted);" data-i18n="subtitle">
        数列の海から、価値を収集せよ。
      </p>

      <div class="game-area">

        <div class="wasm-status" id="wasmStatus" data-i18n="wasm_loading">読み込み中…</div>

        <!-- ステータスバー -->
        <div class="status-bar">
          <span id="timerDisplay" class="status-timer">—</span>
          <span id="scoreDisplay" class="status-score"></span>
        </div>

        <!-- グリッド -->
        <div class="grid-wrapper" id="gridWrapper">
          <div class="countdown-overlay" id="countdownOverlay">
            <div class="countdown-number" id="countdownNum"></div>
          </div>
          <div class="grid" id="grid"></div>
        </div>

        <!-- 通知 -->
        <div class="notification-area">
          <div class="notification" id="notification"></div>
        </div>

        <!-- ボタン -->
        <div class="btn-row">
          <button class="game-btn font-geosans" id="startBtn" onclick="startGame()" disabled data-i18n="start">スタート</button>
          <button class="game-btn font-geosans" id="passBtn"  onclick="passGrid()"  disabled data-i18n="pass">パス</button>
        </div>

        <!-- 結果 -->
        <div class="result-overlay" id="resultOverlay">
          <div class="result-label font-geosans" data-i18n="result_label">RESULT</div>
          <div class="result-score font-geosans" id="resultScore">0</div>
          <div class="result-unit font-kazesawa-light" data-i18n="result_unit">点</div>
          <button class="game-btn font-geosans" onclick="resetGame()" data-i18n="play_again">もう一度</button>
        </div>

      </div>

      <a href="index.html" class="back-link font-geosans" data-i18n="back">← Pastimeへ</a>
    </main>
    <div id="shared-footer"></div>
  </div>

<script src="../shared-nav.js"></script>
<script>

    result_label:       'TULOS',
    result_unit:        'pistettä',
    play_again:         'Uudelleen',
    back:               '← Ajanviete',
    score_suffix:       ' p.',
    timer_suffix:       's',
    msg_result_teaser:  'Tulos…',
    msg_got:            ' saatu: ',
    msg_run_small:      'Pientä tuuria',
    msg_run_medium:     'Sinulla on tuuria!',
    msg_run_large:      'Uskomaton tuuri!',
    msg_e:              'Yksi-kahdeksan-kaksi-kahdeksan…',
    msg_pi:             'Kolme-yksi-neljä-yksi…',

  }
};

/* =====================================================================
   アワードキーインデックス — babel.nim の定数と順序を合わせること
===================================================================== */
var AWARD_KEYS = [
  'msg_run_small',   /* 0 */
  'msg_run_medium',  /* 1 */
  'msg_run_large',   /* 2 */
  'msg_e',           /* 3 */
  'msg_pi',          /* 4 */
  'msg_sqrt2',       /* 5 */
  'msg_phi',         /* 6 */
  'msg_cbrt2',       /* 7 */
  'msg_champ',       /* 8 */
  'msg_fumo',        /* 9 */
];

/* =====================================================================
   JS フォールバック用採点定数（WASM ロード失敗時に使用）
===================================================================== */
var SCORE_CONSTANTS = [
  { digits: '2718281828459045', key: 'msg_e'     },
  { digits: '3141592653589793', key: 'msg_pi'    },
  { digits: '141421356',        key: 'msg_sqrt2' },
  { digits: '161803398',        key: 'msg_phi'   },
  { digits: '12599210498',      key: 'msg_cbrt2' },
];
var FUMO_SEQ = '1145141919810';
var CHAMPERNOWNE = '012345678910111213';

/* =====================================================================
   WASM — Nim ゲームシステム (babel.nim → babel.wasm)
===================================================================== */
var wasmExports = null;
var wasmMem     = null;   /* Uint8Array view of WASM memory */
var gridBufPtr  = 0;      /* offset of gridBuf in WASM memory */
var traceBufPtr = 0;      /* offset of traceBuf in WASM memory */
var rngState    = 0;

function initWasm() {
  fetch('babel.wasm')
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.arrayBuffer();
    })
    .then(function(buf) { return WebAssembly.instantiate(buf); })
    .then(function(result) {
      wasmExports = result.instance.exports;
      wasmMem     = new Uint8Array(wasmExports.memory.buffer);
      gridBufPtr  = wasmExports.gridBufPtr();
      traceBufPtr = wasmExports.traceBufPtr();
      document.getElementById('wasmStatus').textContent = t('wasm_ready');
      document.getElementById('startBtn').disabled = false;
    })
    .catch(function(e) {
      /* WASM が存在しない場合は JS フォールバックで動作 */
      console.warn('babel.wasm not loaded, using JS fallback:', e);
      document.getElementById('wasmStatus').textContent = t('wasm_error');
      document.getElementById('startBtn').disabled = false;
    });
}

/* 次の数字を1つ生成 (WASM RNG 優先、なければ Math.random) */
function nimNextDigit() {
  if (wasmExports) {
    rngState = wasmExports.nextSeed(rngState) >>> 0;
    return wasmExports.digit(rngState) >>> 0;
  }
  return Math.floor(Math.random() * 10);
}

/* =====================================================================
   状態
===================================================================== */
var gridDigits  = new Array(100).fill(0);   /* 数字値 0-9 */
var usedCells   = new Array(100).fill(false);
var gameActive  = false;
var gameStarted = false;
var score       = 0;
var timeLeft    = 90;
var timerInterval = null;


/* ============================================================
   異常演出状態
============================================================ */
var anomalyActive = false;
var anomalyCritical = false;
var anomalyTriggered = false;
var anomalyNoiseInterval = null;
var anomalyProgressInterval = null;
var anomalyFrameId = null;
var anomalyStartedAt = 0;
var anomalyJoltX = 0;
var anomalyJoltY = 0;
var anomalyJoltAngle = 0;
var anomalyJoltStartedAt = 0;
var anomalyJoltDuration = 0;
var anomalyGlitchSkewX = 0;
var anomalyGlitchSkewY = 0;

var isTracing    = false;
var traceIndices = [];

var notifQueue = [];
var notifBusy  = false;

/* =====================================================================
   言語ヘルパー
===================================================================== */
function currentLang() { return localStorage.getItem('lang') || 'ja'; }
function t(key) {
  var d = pageI18n[currentLang()] || pageI18n['ja'];
  return d[key] !== undefined ? d[key] : (pageI18n['ja'][key] || key);
}

/* =====================================================================
   グリッド構築 / 描画
===================================================================== */
function buildGrid() {
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (var i = 0; i < 100; i++) {
    var cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.index = i;
    grid.appendChild(cell);
  }
}

function randomizeGrid() {
  if (wasmExports) {
    rngState = (Math.random() * 0xFFFFFFFF) >>> 0;
  }
  for (var i = 0; i < 100; i++) {
    var d = nimNextDigit();
    gridDigits[i] = d;
    /* WASM グリッドバッファにも書き込む（採点エンジン用） */
    if (wasmMem) wasmMem[gridBufPtr + i] = d;
  }
  clearUsedCells();
  renderGrid();
}

function renderGrid() {
  var cells = document.querySelectorAll('.cell');
  cells.forEach(function(cell, i) {
    cell.textContent = (gameActive || gameStarted) ? String(gridDigits[i]) : '';
    cell.classList.remove('traced', 'scored');
    if (gameActive) {
      cell.classList.add('active');
      if (usedCells[i]) cell.classList.add('used');
      else               cell.classList.remove('used');
    } else {
      cell.classList.remove('active', 'used');
    }
  });
}

/* =====================================================================
   使用済みセル管理
===================================================================== */
function clearUsedCells() {
  usedCells = new Array(100).fill(false);
  document.querySelectorAll('.cell.used').forEach(function(c) {
    c.classList.remove('used');
  });
}

function markTracedCellsUsed() {
  traceIndices.forEach(function(idx) {
    usedCells[idx] = true;
    var cell = document.querySelector('.cell[data-index="' + idx + '"]');
    if (cell) cell.classList.add('used');
  });
}

/* =====================================================================
   ゲーム制御
===================================================================== */
function startGame() {
  if (gameStarted) return;

  stopAnomaly();
  anomalyTriggered = false;
  anomalyCritical = false;
  gameStarted = true;
  score    = 0;
  timeLeft = 90;
  randomizeGrid();

  document.getElementById('startBtn').disabled = true;
  document.getElementById('passBtn').disabled  = true;
  document.getElementById('resultOverlay').classList.remove('visible');
  document.getElementById('scoreDisplay').textContent = '';

  var overlay = document.getElementById('countdownOverlay');
  var numEl   = document.getElementById('countdownNum');
  overlay.classList.add('visible');

  var count = 3;
  numEl.textContent = count;

  var cd = setInterval(function() {
    count--;
    if (count <= 0) {
      clearInterval(cd);
      overlay.classList.remove('visible');
      beginPlay();
    } else {
      numEl.style.animation = 'none';
      void numEl.offsetWidth;
      numEl.style.animation = '';
      numEl.textContent = count;
    }
  }, 1000);
}

function beginPlay() {
  gameActive = true;
  renderGrid();
  updateStatusBar();
  document.getElementById('passBtn').disabled = false;

  timerInterval = setInterval(function() {
    timeLeft--;
    updateStatusBar();

    /* ゲーム開始から40秒経過 = 残り50秒 */
    if (timeLeft === 50 && score === 0) {
      startAnomaly();
    }

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;

      if (anomalyTriggered) {
        gameActive = false;
        gameStarted = false;
        clearCurrentTrace();
        clearUsedCells();
        document.getElementById('passBtn').disabled = true;
        showFatalError();
      } else {
        endGame();
      }
    }
  }, 1000);
}

function updateStatusBar() {
  var timerEl = document.getElementById('timerDisplay');
  timerEl.textContent = timeLeft + t('timer_suffix');
  timerEl.className   = 'status-timer' + (timeLeft <= 10 ? ' urgent' : '');
  document.getElementById('scoreDisplay').textContent = score + t('score_suffix');
}

function passGrid() {
  if (!gameActive) return;
  clearCurrentTrace();
  randomizeGrid();
}

function endGame() {
  gameActive  = false;
  gameStarted = false;
  clearCurrentTrace();
  clearUsedCells();

  document.querySelectorAll('.cell').forEach(function(c) {
    c.textContent = String(gridDigits[parseInt(c.dataset.index)]);
    c.classList.remove('active', 'traced', 'scored', 'used');
  });

  document.getElementById('passBtn').disabled  = true;
  document.getElementById('startBtn').disabled = true;
  document.getElementById('timerDisplay').textContent = '0' + t('timer_suffix');

  notifQueue = [];
  notifBusy  = false;
  var notif = document.getElementById('notification');
  notif.textContent = t('msg_result_teaser');   /* ← i18n 対応 */
  notif.classList.add('visible');

  setTimeout(function() {
    notif.classList.remove('visible');
    setTimeout(showResult, 300);
  }, 1800);
}

function showResult() {
  document.getElementById('resultScore').textContent = score;
  document.getElementById('resultOverlay').classList.add('visible');
  document.getElementById('startBtn').disabled = false;
}

function resetGame() {
  stopAnomaly();
  anomalyTriggered = false;
  anomalyCritical = false;
  document.getElementById('resultOverlay').classList.remove('visible');
  document.getElementById('timerDisplay').textContent = '—';
  document.getElementById('scoreDisplay').textContent = '';
  document.querySelectorAll('.cell').forEach(function(c) {
    c.textContent = '';
    c.classList.remove('active', 'traced', 'scored', 'used');
  });
}

/* =====================================================================
   トレース入力 (マウス + タッチ)
===================================================================== */
function getCellFromPoint(x, y) {
  var el = document.elementFromPoint(x, y);
  if (!el) return null;
  if (el.classList.contains('cell')) return el;
  return (el.closest && el.closest('.cell')) || null;
}

function traceStart(cell) {
  if (!gameActive) return;
  var idx = parseInt(cell.dataset.index);
  if (usedCells[idx]) return;  /* 使用済みセルではトレース開始しない */
  isTracing    = true;
  traceIndices = [];
  addCellToTrace(cell);
}

function traceMove(x, y) {
  if (!isTracing || !gameActive) return;
  var cell = getCellFromPoint(x, y);
  if (cell) addCellToTrace(cell);
}

function traceEnd() {
  if (!isTracing) return;
  isTracing = false;
  evaluateTrace();
  clearCurrentTrace();
}

function addCellToTrace(cell) {
  var idx = parseInt(cell.dataset.index);

  /*
    使用済みセルに触れたらトレースをそこで打ち切る。
    ※ CSS の pointer-events を none にすると elementFromPoint が
       使用済みセルを検出できず、先の有効セルへ繋がってしまうため、
       pointer-events は残しつつここで JS 側で判定・打ち切りを行う。
  */
  if (usedCells[idx]) {
    traceEnd();
    return;
  }

  if (traceIndices.indexOf(idx) !== -1) return;  /* すでにトレース中 */
  traceIndices.push(idx);
  cell.classList.add('traced');
}

function clearCurrentTrace() {
  document.querySelectorAll('.cell.traced').forEach(function(c) {
    c.classList.remove('traced');
  });
  traceIndices = [];
  isTracing    = false;
}

/* マウスイベント */
document.getElementById('gridWrapper').addEventListener('mousedown', function(e) {
  var cell = e.target.closest && e.target.closest('.cell');
  if (cell) traceStart(cell);
});
document.addEventListener('mousemove', function(e) {
  if (isTracing) traceMove(e.clientX, e.clientY);
});
document.addEventListener('mouseup', function() {
  if (isTracing) traceEnd();
});

/* タッチイベント */
document.getElementById('gridWrapper').addEventListener('touchstart', function(e) {
  if (!gameActive) return;
  e.preventDefault();
  var touch = e.touches[0];
  var cell = getCellFromPoint(touch.clientX, touch.clientY);
  if (cell) traceStart(cell);
}, { passive: false });

document.getElementById('gridWrapper').addEventListener('touchmove', function(e) {
  if (!isTracing) return;
  e.preventDefault();
  var touch = e.touches[0];
  traceMove(touch.clientX, touch.clientY);
}, { passive: false });

document.getElementById('gridWrapper').addEventListener('touchend', function(e) {
  e.preventDefault();
  if (isTracing) traceEnd();
}, { passive: false });

/* =====================================================================
   採点エンジン
   WASM が利用可能な場合は Nim 実装を使用し、それ以外は JS フォールバック
===================================================================== */
function evaluateTrace() {
  if (traceIndices.length < 1) return;

  if (wasmExports && wasmMem) {
    evaluateTraceWasm();
  } else {
    evaluateTraceJS();
  }
}

/* ── WASM 採点（babel.nim の evalTrace を呼ぶ） ── */
function evaluateTraceWasm() {
  var len = traceIndices.length;

  /* トレースインデックスを WASM メモリに書き込む */
  for (var i = 0; i < len; i++) {
    wasmMem[traceBufPtr + i] = traceIndices[i];
  }

  var totalPts = wasmExports.evalTrace(len);
  if (totalPts <= 0) return;

  markTracedCellsUsed();
  flashTracedCells();

  var cnt = wasmExports.getAwardCount();
  for (var ai = 0; ai < cnt; ai++) {
    var pts    = wasmExports.getAwardPts(ai);
    var keyIdx = wasmExports.getAwardKey(ai);
    score += pts;
    if (anomalyActive && pts > 0) stopAnomaly();
    updateStatusBar();
    enqueueNotification(pts, t(AWARD_KEYS[keyIdx]));
  }
}

/* ── JS フォールバック採点（WASM なし時） ── */
function evaluateTraceJS() {
  var seq    = traceIndices.map(function(i) { return String(gridDigits[i]); }).join('');
  var awards = [];

  /* 1. 同じ数字の連続 (3+) */
  var i = 0;
  while (i < seq.length) {
    var j = i + 1;
    while (j < seq.length && seq[j] === seq[i]) j++;
    var runLen = j - i;
    if (runLen >= 3) {
      var rKey = runLen <= 5 ? 'msg_run_small'
               : runLen <= 8 ? 'msg_run_medium'
               :               'msg_run_large';
      awards.push({ pts: runLen, key: rKey });
    }
    i = j;
  }

  /* 2. 数学定数 (先頭から 3+ 一致) */
  for (var ci = 0; ci < SCORE_CONSTANTS.length; ci++) {
    var c = SCORE_CONSTANTS[ci];
    var matchLen = 0;
    var maxCheck = Math.min(seq.length, c.digits.length);
    for (var k = 0; k < maxCheck; k++) {
      if (seq[k] === c.digits[k]) matchLen++;
      else break;
    }
    if (matchLen >= 3) {
      awards.push({ pts: matchLen * 2, key: c.key });
    }
  }

  /* 3. チャンパーノウン数列 (任意位置, 5+) */
  var champMatch = longestCommonSubstring(seq, CHAMPERNOWNE);
  if (champMatch >= 5) {
    awards.push({ pts: champMatch, key: 'msg_champ' });
  }

  /* 4. 1145141919810 (任意位置, 6+) */
  var fumoMatch = longestCommonSubstring(seq, FUMO_SEQ);
  if (fumoMatch >= 6) {
    awards.push({ pts: fumoMatch, key: 'msg_fumo' });
  }

  if (awards.length > 0) {
    markTracedCellsUsed();
    flashTracedCells();
    for (var ai = 0; ai < awards.length; ai++) {
      var awardedPts = awards[ai].pts;
      score += awardedPts;
      if (anomalyActive && awardedPts > 0) stopAnomaly();
      updateStatusBar();
      enqueueNotification(awardedPts, t(awards[ai].key));
    }
  }
}

function longestCommonSubstring(s, tgt) {
  var max = 0;
  for (var si = 0; si < s.length; si++) {
    for (var ti = 0; ti < tgt.length; ti++) {
      var len = 0;
      while (si + len < s.length && ti + len < tgt.length &&
             s[si + len] === tgt[ti + len]) len++;
      if (len > max) max = len;
    }
  }
  return max;
}

function flashTracedCells() {
  traceIndices.forEach(function(idx) {
    var cell = document.querySelector('.cell[data-index="' + idx + '"]');
    if (!cell) return;
    cell.classList.remove('traced');
    void cell.offsetWidth;
    cell.classList.add('scored');
    setTimeout(function() {
      cell.classList.remove('scored');
      if (usedCells[idx]) cell.classList.add('used');
    }, 480);
  });
}

/* =====================================================================
   通知キュー
===================================================================== */
function enqueueNotification(pts, msg) {
  notifQueue.push({ pts: pts, msg: msg });
  if (!notifBusy) processNotifQueue();
}

function processNotifQueue() {
  if (notifQueue.length === 0) { notifBusy = false; return; }
  notifBusy = true;
  var item  = notifQueue.shift();
  var notif = document.getElementById('notification');
  /* ← '+N点ゲット！: メッセージ' 形式を i18n 化 */
  notif.textContent = '+' + item.pts + t('score_suffix') + t('msg_got') + item.msg;
  notif.classList.add('visible');
  setTimeout(function() {
    notif.classList.remove('visible');
    setTimeout(processNotifQueue, 220);
  }, 1700);
}


/* =====================================================================
   異常演出システム
===================================================================== */
function getAnomalyProgress() {
  /* 発動する残り50秒から0秒までを0.0〜1.0にする */
  var now = window.performance && window.performance.now
    ? window.performance.now()
    : Date.now();
  var p = anomalyStartedAt
    ? (now - anomalyStartedAt) / 50000
    : (50 - timeLeft) / 50;
  return Math.max(0, Math.min(1, p));
}

function startAnomaly() {
  if (anomalyTriggered || !gameActive || score !== 0) return;

  anomalyTriggered = true;
  anomalyActive = true;
  anomalyStartedAt = window.performance && window.performance.now
    ? window.performance.now()
    : Date.now();
  document.body.classList.add('anomaly-active');

  updateAnomalyEffect();

  /* 傾きはアニメーションフレームで連続更新する */
  anomalyFrameId = requestAnimationFrame(runAnomalyFrame);

  anomalyProgressInterval = setInterval(function() {
    if (!anomalyActive) return;

    if (timeLeft <= 5 && !anomalyCritical) {
      startCriticalAnomaly();
    }
  }, 50);

  anomalyNoiseInterval = setInterval(function() {
    if (!anomalyActive) return;

    var count = anomalyCritical ? 2 + Math.floor(Math.random() * 3) : 1;
    for (var i = 0; i < count; i++) spawnRandomAnomaly();
  }, 170);
}

function runAnomalyFrame() {
  if (!anomalyActive) {
    anomalyFrameId = null;
    return;
  }

  updateAnomalyEffect();
  anomalyFrameId = requestAnimationFrame(runAnomalyFrame);
}

function updateAnomalyEffect() {
  if (!anomalyActive) return;

  var p = getAnomalyProgress();
  var now = window.performance && window.performance.now
    ? window.performance.now()
    : Date.now();
  var gameArea = document.querySelector('.game-area');

  if (gameArea) {
    /*
      ノイズの有効時間が切れた瞬間に値を0へ戻すため、
      カクカクしたグリッチ感を保つ。
    */
    var joltActive = anomalyJoltDuration > 0 &&
      now - anomalyJoltStartedAt < anomalyJoltDuration;
    var angle = (p * 10) + (joltActive ? anomalyJoltAngle : 0);
    var down = (p * 12) + (joltActive ? anomalyJoltY : 0);
    var side = joltActive ? anomalyJoltX : 0;

    gameArea.style.transform =
      'translate(' + side + 'px,' + down + 'px) rotate(' + angle + 'deg)';
  }

  /*
    最後の5秒はページ全体をskew()させる。
  */
  if (anomalyCritical) {
    var criticalProgress = Math.max(0, Math.min(1, (p - 0.9) / 0.1));
    var baseSkew = criticalProgress * 1.5;
    var skewX = baseSkew + (anomalyGlitchSkewX * criticalProgress);
    var skewY = (anomalyGlitchSkewY * criticalProgress);
    document.body.style.transform =
      'skew(' + skewX.toFixed(3) + 'deg,' + skewY.toFixed(3) + 'deg)';
  } else {
    document.body.style.transform = '';
  }

  var chromatic = document.getElementById('anomaly-chromatic');
  if (chromatic) chromatic.style.opacity = String(0.05 + p * 0.95);

  var moja = document.getElementById('moja-overlay');
  if (moja) moja.style.opacity = String(p * 1.5);
}

function spawnRandomAnomaly() {
  var layer = document.getElementById('anomaly-noise-layer');
  if (!layer || !anomalyActive) return;

  var type = Math.floor(Math.random() * 5);
  if (type === 0) spawnBlockNoise(layer);
  else if (type === 1) spawnLineNoise(layer);
  else if (type === 2) spawnRgbNoise(layer);
  else if (type === 3) spawnFlash();
  else spawnShiftNoise();
}

function spawnBlockNoise(layer) {
  var block = document.createElement('div');
  block.className = 'anomaly-block';
  block.style.left = (Math.random() * 100) + '%';
  block.style.top = (Math.random() * 100) + '%';
  block.style.width = (2 + Math.random() * 20) + '%';
  block.style.height = (1 + Math.random() * 10) + '%';
  block.style.opacity = String(0.08 + Math.random() * 0.42);
  layer.appendChild(block);
  setTimeout(function() { if (block.parentNode) block.remove(); }, 40 + Math.random() * 180);
}

function spawnLineNoise(layer) {
  var line = document.createElement('div');
  line.className = 'anomaly-line';
  line.style.top = (Math.random() * 100) + '%';
  line.style.height = (1 + Math.random() * 4) + 'px';
  line.style.opacity = String(0.12 + Math.random() * 0.5);
  line.style.transform = 'translateX(' + ((Math.random() - 0.5) * 30) + 'px)';
  layer.appendChild(line);
  setTimeout(function() { if (line.parentNode) line.remove(); }, 40 + Math.random() * 120);
}

function spawnRgbNoise(layer) {
  var block = document.createElement('div');
  block.className = 'anomaly-rgb-block';
  block.style.left = (Math.random() * 100) + '%';
  block.style.top = (Math.random() * 100) + '%';
  block.style.width = (2 + Math.random() * 18) + '%';
  block.style.height = (1 + Math.random() * 7) + '%';
  block.style.background = Math.random() < 0.5
    ? 'rgba(255,0,0,0.7)'
    : 'rgba(0,0,0,1)';
  block.style.transform = 'translateX(' + ((Math.random() - 0.5) * 20) + 'px)';
  layer.appendChild(block);
  setTimeout(function() { if (block.parentNode) block.remove(); }, 30 + Math.random() * 120);
}

function spawnFlash() {
  var flash = document.getElementById('anomaly-flash');
  if (!flash || !anomalyActive) return;
  var p = getAnomalyProgress();
  flash.style.opacity = String(0.025 + Math.random() * (0.06 + p * 0.18));
  setTimeout(function() { if (flash) flash.style.opacity = '0'; }, 25 + Math.random() * 70);
}

function spawnShiftNoise() {
  if (!anomalyActive) return;

  var p = getAnomalyProgress();
  anomalyJoltX = (Math.random() - 0.5) * (2 + p * 10);
  anomalyJoltY = (Math.random() - 0.5) * (2 + p * 5);
  anomalyJoltAngle = (Math.random() - 0.5) * (p * 3);
  anomalyJoltStartedAt = window.performance && window.performance.now
    ? window.performance.now()
    : Date.now();
  anomalyJoltDuration = 50 + Math.random() * 100;
}

function startCriticalAnomaly() {
  anomalyCritical = true;
  document.body.classList.add('anomaly-critical');
  anomalyGlitchSkewX = 0;
  anomalyGlitchSkewY = 0;

  if (anomalyNoiseInterval) clearInterval(anomalyNoiseInterval);
  anomalyNoiseInterval = setInterval(function() {
    if (!anomalyActive) return;
    var p = getAnomalyProgress();
    var criticalProgress = Math.max(0, Math.min(1, (p - 0.9) / 0.1));

    /* 最後に向かってskewの振れ幅だけを段階的に増やす */
    anomalyGlitchSkewX =
      (Math.random() - 0.5) * (2 + criticalProgress * 18);
    anomalyGlitchSkewY =
      (Math.random() - 0.5) * (1 + criticalProgress * 10);

    var count = 2 + Math.floor(Math.random() * 4);
    for (var i = 0; i < count; i++) spawnRandomAnomaly();
  }, 55);
}

function stopAnomaly() {
  anomalyActive = false;
  anomalyCritical = false;
  anomalyStartedAt = 0;
  anomalyJoltX = 0;
  anomalyJoltY = 0;
  anomalyJoltAngle = 0;
  anomalyJoltStartedAt = 0;
  anomalyJoltDuration = 0;
  anomalyGlitchSkewX = 0;
  anomalyGlitchSkewY = 0;

  if (anomalyFrameId !== null) {
    cancelAnimationFrame(anomalyFrameId);
    anomalyFrameId = null;
  }

  if (anomalyNoiseInterval) {
    clearInterval(anomalyNoiseInterval);
    anomalyNoiseInterval = null;
  }
  if (anomalyProgressInterval) {
    clearInterval(anomalyProgressInterval);
    anomalyProgressInterval = null;
  }

  document.body.classList.remove('anomaly-active', 'anomaly-critical');
  document.body.style.transform = '';

  var gameArea = document.querySelector('.game-area');
  if (gameArea) gameArea.style.transform = '';

  var chromatic = document.getElementById('anomaly-chromatic');
  if (chromatic) chromatic.style.opacity = '0';

  var moja = document.getElementById('moja-overlay');
  if (moja) moja.style.opacity = '0';

  var flash = document.getElementById('anomaly-flash');
  if (flash) flash.style.opacity = '0';

  var layer = document.getElementById('anomaly-noise-layer');
  if (layer) layer.innerHTML = '';
}

function showFatalError() {
  stopAnomaly();

  var overlay = document.getElementById('fatal-error-overlay');
  if (overlay) {
    overlay.setAttribute('aria-hidden', 'false');
    overlay.style.display = 'flex';
  }
}


/* =====================================================================
   多言語 — UI テキスト適用
===================================================================== */
function applyPageLang(lang) {
  var d = pageI18n[lang] || pageI18n['ja'];
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var key = el.getAttribute('data-i18n');
    if (key in d) el.textContent = d[key];
  });
  if (gameActive || gameStarted) updateStatusBar();
}

var _origSetLang = window.setLang;
window.setLang = function(lang) {
  if (_origSetLang) _origSetLang(lang);
  applyPageLang(lang);
};

/* =====================================================================
   初期化
===================================================================== */
function init() {
  buildGrid();
  applyPageLang(currentLang());

  /* DOM生成後にイベントを登録する */
  var closeButton = document.getElementById('fatal-error-close');
  if (closeButton) {
    closeButton.addEventListener('click', function() {
      window.location.href = 'index.html';
    });
  }

  initWasm(); /* babel.wasm を非同期ロード → 完了後スタートボタンを有効化 */
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
