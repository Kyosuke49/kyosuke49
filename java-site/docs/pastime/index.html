<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暇つぶし — 偽造切手</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .game-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin: 2rem 0;
    }
    .game-item {
      border-bottom: 1px solid var(--border);
      padding: 1.4rem 0;
    }
    .game-item:first-child {
      border-top: 1px solid var(--border);
    }
    .game-item a {
      display: block;
      text-decoration: none;
      color: inherit;
      transition: opacity 0.18s ease;
    }
    .game-item a:hover { opacity: 0.55; }
    .game-title {
      font-family: 'Geosans', sans-serif;
      font-size: 1.05rem;
      letter-spacing: 0.08em;
      margin-bottom: 0.3rem;
    }
    .game-desc {
      font-family: 'Kazesawa', system-ui, sans-serif;
      font-weight: 300;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .game-tag {
      display: inline-block;
      font-family: 'Geosans', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      border: 1px solid var(--border);
      padding: 0.1rem 0.5rem;
      margin-top: 0.5rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div id="shared-header"></div>

  <div class="container">
    <main class="sub-main">
      <h1 class="page-title font-kazesawa">暇つぶし</h1>

      <div class="game-list">
        <div class="game-item">
          <a href="fizzbuzz.html">
            <p class="game-title">変なFizzBuzz</p>
            <p class="game-desc">FizzBuzzにWoofが乱入。このカオスに耐えながら、タイムの更新を目指せ。</p>
            <span class="game-tag">LISP</span>
          </a>
        </div>
        <div class="game-item">
          <a href="wordquiz.html">
            <p class="game-title">Word Quiz</p>
            <p class="game-desc">ヒントから単語を当てる。</p>
            <span class="game-tag">LISP</span>
          </a>
        </div>
        <div class="game-item">
          <a href="omikuji.html">
            <p class="game-title">Omikuji</p>
            <p class="game-desc">あなたの運値はどれくらい？</p>
            <span class="game-tag">Nim</span>
          </a>
        </div>
      </div>

      <a href="../../../index.html" class="back-link font-geosans">← トップへ</a>
    </main>
    <div id="shared-footer"></div>
  </div>

  <script src="../shared-nav.js"></script>
</body>
</html>
