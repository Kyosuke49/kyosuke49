<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おみくじ — 偽造切手</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .game-area {
      margin: 2rem 0;
      border-top: 1px solid var(--border);
      padding-top: 2rem;
    }

    .btn-row {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      margin: 2rem 0;
    }
    .draw-btn {
      background: none;
      border: 1px solid var(--black);
      font-family: 'Geosans', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      padding: 0.65rem 2.2rem;
      cursor: pointer;
      color: var(--fg);
      transition: background 0.15s ease, color 0.15s ease;
    }
    .draw-btn:hover  { background: var(--black); color: var(--white); }
    .draw-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .draw-btn:disabled:hover { background: none; color: var(--fg); }

    .wasm-status {
      text-align: center;
      font-family: 'Geosans', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 0.5rem;
      min-height: 1.2em;
    }

    /* ── 単発 結果 ── */
    .single-result {
      display: none;
      border: 1px solid var(--border);
      padding: 2rem 1.5rem;
      margin: 0 auto 2rem;
      max-width: 400px;
      animation: fadeIn 0.3s ease;
    }
    .single-result.visible { display: block; }

    .rank-display {
      font-family: 'Geosans', sans-serif;
      font-size: clamp(2.2rem, 8vw, 4.2rem);
      letter-spacing: 0.08em;
      text-align: center;
      line-height: 1.1;
      margin-bottom: 0.7rem;
    }
    .rank-desc {
      font-family: 'Kazesawa', system-ui, sans-serif;
      font-weight: 300;
      font-size: 0.88rem;
      text-align: center;
      color: var(--muted);
      margin-bottom: 1.8rem;
    }
    .fortune-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .fortune-table tr { border-top: 1px solid var(--border); }
    .fortune-table tr:last-child { border-bottom: 1px solid var(--border); }
    .fortune-table th {
      font-family: 'Geosans', sans-serif;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-align: left;
      padding: 0.55rem 0.5rem 0.55rem 0;
      width: 6.5rem;
    }
    .fortune-table td {
      font-family: 'Kazesawa', system-ui, sans-serif;
      font-weight: 300;
      padding: 0.55rem 0;
    }

    /* ── 10連 結果グリッド ── */
    .multi-result {
      display: none;
      margin: 0 auto 2rem;
      animation: fadeIn 0.3s ease;
    }
    .multi-result.visible { display: block; }

    .gacha-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.5rem;
    }
    @media (max-width: 560px) {
      .gacha-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .gacha-card {
      border: 1px solid var(--border);
      padding: 1rem 0.6rem 1.1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s ease;
      animation: popIn 0.25s ease both;
    }
    .gacha-card:hover { border-color: var(--black); }
    .gacha-card.selected { border-color: var(--black); background: var(--black); color: var(--white); }
    .gacha-card.selected .gacha-rank { color: var(--white); }
    .gacha-card.selected .gacha-subdesc { color: rgba(255,255,255,0.55); }

    .gacha-rank {
      font-family: 'Geosans', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      line-height: 1.2;
      margin-bottom: 0.4rem;
      color: var(--fg);
    }
    .gacha-subdesc {
      font-family: 'Kazesawa', system-ui, sans-serif;
      font-weight: 300;
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .gacha-num {
      font-family: 'Geosans', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 0.55rem;
    }
    .gacha-card.selected .gacha-num { color: rgba(255,255,255,0.45); }

    .detail-panel {
      display: none;
      border: 1px solid var(--border);
      border-top: none;
      padding: 1.4rem 1.2rem;
      margin-bottom: 0.5rem;
    }
    .detail-panel.visible { display: block; animation: fadeIn 0.2s ease; }
    .detail-rank {
      font-family: 'Geosans', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.06em;
      margin-bottom: 0.3rem;
    }
    .detail-desc {
      font-family: 'Kazesawa', system-ui, sans-serif;
      font-weight: 300;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1.2rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.88); }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="shared-header"></div>

  <div class="container">
    <main class="sub-main">
      <h1 class="page-title font-kazesawa" data-i18n="title">おみくじ</h1>

      <p class="font-kazesawa-light" style="font-size:0.9rem; color:var(--muted);" data-i18n="subtitle">
        レッツスタート！
      </p>

      <div class="game-area">

        <div class="wasm-status" id="wasmStatus" data-i18n="loading">読み込み中…</div>

        <div class="btn-row">
          <button class="draw-btn font-geosans" onclick="drawSingle()" disabled data-i18n="single">単発</button>
          <button class="draw-btn font-geosans" onclick="drawMulti()" disabled data-i18n="multi">10連</button>
        </div>

        <!-- 単発 結果 -->
        <div class="single-result" id="singleResult">
          <div class="rank-display font-geosans" id="rankDisplay"></div>
          <div class="rank-desc font-kazesawa-light" id="descDisplay"></div>
          <table class="fortune-table">
            <tr><th data-i18n="love">恋愛</th><td id="loveTd"></td></tr>
            <tr><th data-i18n="work">仕事</th><td id="workTd"></td></tr>
            <tr><th data-i18n="health">健康</th><td id="healthTd"></td></tr>
            <tr><th data-i18n="lucky">ラッキーカラー</th><td id="luckyTd"></td></tr>
          </table>
        </div>

        <!-- 10連 結果 -->
        <div class="multi-result" id="multiResult">
          <div class="gacha-grid" id="gachaGrid"></div>
          <div class="detail-panel" id="detailPanel">
            <div class="detail-rank font-geosans" id="detailRank"></div>
            <div class="detail-desc font-kazesawa-light" id="detailDesc"></div>
            <table class="fortune-table">
              <tr><th data-i18n="love">恋愛</th><td id="detailLove"></td></tr>
              <tr><th data-i18n="work">仕事</th><td id="detailWork"></td></tr>
              <tr><th data-i18n="health">健康</th><td id="detailHealth"></td></tr>
              <tr><th data-i18n="lucky">ラッキーカラー</th><td id="detailLucky"></td></tr>
            </table>
          </div>
        </div>

      </div>

      <a href="index.html" class="back-link font-geosans" data-i18n="back">← Pastimeへ</a>
    </main>
    <div id="shared-footer"></div>
  </div>

<script src="../shared-nav.js"></script>

    { rank: '小吉',   desc: '悪くはない',                       love: '友達できるかも',         work: '努力を怠るべからず',       health: 'ZONe飲んでおこう',         lucky: '黄'   },
    { rank: '吉',     desc: '当たり前を享受すべし',             love: '誠実さが大事',           work: '石の上にもなんとやら',     health: '早寝早起き大事',           lucky: '緑'   },

    { rank: 'Gutes Glück',   desc: 'Läuft ganz gut, würde ich sagen.',                  love: 'Vielleicht gesteht jemand seine Gefühle', work: 'Dein Einsatz zahlt sich aus',    health: 'Du wirst wohl nicht krank',                lucky: 'Blau'  },
    { rank: 'Kleines Glück', desc: 'Nicht schlecht.',                                    love: 'Du findest vielleicht neue Freunde',work: 'Nicht nachlassen, streng dich an',    health: 'Trink mal was Ordentliches',               lucky: 'Gelb'  },
    { rank: 'Glück',         desc: 'Schätze das Gewöhnliche.',                           love: 'Aufrichtigkeit ist alles',          work: 'Beharrlichkeit zahlt sich aus',        health: 'Früh schlafen, früh aufstehen',            lucky: 'Grün'  },
    { rank: 'Wenig Glück',   desc: 'Wirst du gerade etwas überheblich?',                love: 'Gespräche verlaufen etwas holprig', work: 'Keine Hast, bleib wie immer',          health: 'Vielleicht mit dem Rauchen aufhören?',    lucky: 'Weiß'  },

    { rank: 'Pieni onni',    desc: 'Ei huono.',                                          love: 'Saatat löytää uusia ystäviä',      work: 'Älä laiskottele, tee töitä',           health: 'Juo jotain kunnollista',                   lucky: 'Keltainen' },
    { rank: 'Onni',          desc: 'Arvosta tavallista arkeasi.',                        love: 'Rehellisyys on tärkeää',           work: 'Sinnikkyys kannattaa',                 health: 'Nuku ajoissa, herää varhain',              lucky: 'Vihreä'    },

  ]

/* =====================================================================
   状態
===================================================================== */
var wasmExports   = null;
var singleIdx     = -1;
var multiIdxs     = [];
var selectedMulti = -1;

function currentLang() {
  return localStorage.getItem('lang') || 'ja';
}

function getFortune(idx) {
  return fortunes[currentLang()][idx];
}

/* =====================================================================
   WASM 初期化
===================================================================== */
function initWasm() {
  fetch('omikuji.wasm')
    .then(function(r) { return r.arrayBuffer(); })
    .then(function(buf) {
      return WebAssembly.instantiate(buf);
    })
    .then(function(result) {
      wasmExports = result.instance.exports;
      document.querySelectorAll('.draw-btn').forEach(function(b) {
        b.disabled = false;
      });
      document.getElementById('wasmStatus').textContent = '';
    })
    .catch(function(e) {
      var lang = currentLang();
      var t = pageI18n[lang] || pageI18n['ja'];
      document.getElementById('wasmStatus').textContent = t.error;
      console.error('WASM load failed:', e);
    });
}

function nimDraw() {
  var seed = (Math.random() * 0xFFFFFFFF) >>> 0;
  return wasmExports.draw(seed);
}

/* =====================================================================
   単発
===================================================================== */
function drawSingle() {
  singleIdx = nimDraw();
  renderSingle();
  document.getElementById('singleResult').classList.add('visible');
  document.getElementById('multiResult').classList.remove('visible');
  document.getElementById('detailPanel').classList.remove('visible');
}

function renderSingle() {
  if (singleIdx < 0) return;
  var f = getFortune(singleIdx);
  document.getElementById('rankDisplay').textContent = f.rank;
  document.getElementById('descDisplay').textContent = f.desc;
  document.getElementById('loveTd').textContent      = f.love;
  document.getElementById('workTd').textContent      = f.work;
  document.getElementById('healthTd').textContent    = f.health;
  document.getElementById('luckyTd').textContent     = f.lucky;
}

/* =====================================================================
   10連
===================================================================== */
function drawMulti() {
  multiIdxs = [];
  for (var i = 0; i < 10; i++) {
    multiIdxs.push(nimDraw());
  }
  selectedMulti = -1;
  renderMultiGrid();
  document.getElementById('detailPanel').classList.remove('visible');
  document.getElementById('multiResult').classList.add('visible');
  document.getElementById('singleResult').classList.remove('visible');
}

function renderMultiGrid() {
  var grid = document.getElementById('gachaGrid');
  grid.innerHTML = '';
  multiIdxs.forEach(function(idx, i) {
    var f = getFortune(idx);
    var card = document.createElement('div');
    card.className = 'gacha-card';
    card.style.animationDelay = (i * 0.04) + 's';
    if (i === selectedMulti) card.classList.add('selected');
    card.innerHTML =
      '<div class="gacha-num font-geosans">' + (i + 1) + '</div>' +
      '<div class="gacha-rank font-geosans">' + f.rank + '</div>' +
      '<div class="gacha-subdesc font-kazesawa-light">' + f.desc + '</div>';
    card.addEventListener('click', (function(ii) {
      return function() { selectCard(ii); };
    })(i));
    grid.appendChild(card);
  });
}

function selectCard(idx) {
  if (selectedMulti === idx) {
    selectedMulti = -1;
    document.querySelectorAll('.gacha-card').forEach(function(c) {
      c.classList.remove('selected');
    });
    document.getElementById('detailPanel').classList.remove('visible');
    return;
  }
  selectedMulti = idx;
  document.querySelectorAll('.gacha-card').forEach(function(c) {
    c.classList.remove('selected');
  });
  document.querySelectorAll('.gacha-card')[idx].classList.add('selected');
  renderDetail();
  document.getElementById('detailPanel').classList.add('visible');
}

function renderDetail() {
  if (selectedMulti < 0) return;
  var f = getFortune(multiIdxs[selectedMulti]);
  document.getElementById('detailRank').textContent   = f.rank;
  document.getElementById('detailDesc').textContent   = f.desc;
  document.getElementById('detailLove').textContent   = f.love;
  document.getElementById('detailWork').textContent   = f.work;
  document.getElementById('detailHealth').textContent = f.health;
  document.getElementById('detailLucky').textContent  = f.lucky;
}

/* =====================================================================
   多言語 — UI テキスト
===================================================================== */
function applyPageLang(lang) {
  var t = pageI18n[lang] || pageI18n['ja'];
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var key = el.getAttribute('data-i18n');
    if (key in t) el.textContent = t[key];
  });
  /* 結果が表示中なら言語を切り替えて再描画 */
  if (document.getElementById('singleResult').classList.contains('visible')) {
    renderSingle();
  }
  if (document.getElementById('multiResult').classList.contains('visible')) {
    renderMultiGrid();
    if (selectedMulti >= 0) renderDetail();
  }
}

/* =====================================================================
   初期化 — shared-nav.js の setLang をラップ
===================================================================== */
var _origSetLang = window.setLang;
window.setLang = function(lang) {
  _origSetLang(lang);
  applyPageLang(lang);
};

function init() {
  applyPageLang(currentLang());
  initWasm();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
