<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>変なFizzBuzz — 偽造切手</title>
  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.jsdelivr.net/npm/biwascheme@0.8.0/release/biwascheme-min.js"></script>
  <style>
    .game-area {
      margin: 2rem 0;
      border-top: 1px solid var(--border);
      padding-top: 2rem;
    }
    .number-display {
      font-family: 'Geosans', sans-serif;
      font-size: clamp(3rem, 10vw, 6rem);
      letter-spacing: 0.05em;
      text-align: center;
      margin: 1.5rem 0;
      line-height: 1;
    }
    .answer-row {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: center;
      margin: 1.5rem 0;
    }
    .ans-btn {
      background: none;
      border: 1px solid var(--border);
      font-family: 'Geosans', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      padding: 0.6rem 1.4rem;
      cursor: pointer;
      color: var(--fg);
      transition: background 0.15s ease, color 0.15s ease;
    }
    .ans-btn:hover        { background: var(--black); color: var(--white); }
    .ans-btn.correct      { background: var(--black); color: var(--white); border-color: var(--black); }
    .ans-btn.wrong        { border-color: #bbb; color: #bbb; }
    .ans-btn:disabled     { cursor: default; }
    .feedback {
      font-family: 'Kazesawa', system-ui, sans-serif;
      font-weight: 300;
      text-align: center;
      min-height: 1.5rem;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }
    .score-row {
      display: flex;
      justify-content: center;
      gap: 2rem;
      font-family: 'Geosans', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    .score-row span { color: var(--fg); }
    .timer-row {
      display: flex;
      justify-content: center;
      gap: 2rem;
      font-family: 'Geosans', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    .timer-row span { color: var(--fg); }
    #timerDisplay {
      font-size: 1rem;
      letter-spacing: 0.06em;
      color: var(--fg) !important;
    }
    .next-btn {
      display: block;
      margin: 0 auto;
      background: none;
      border: 1px solid var(--black);
      font-family: 'Geosans', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      padding: 0.55rem 2rem;
      cursor: pointer;
      color: var(--fg);
      transition: background 0.15s ease, color 0.15s ease;
    }
    .next-btn:hover    { background: var(--black); color: var(--white); }
    .next-btn:disabled { opacity: 0.3; cursor: default; }
    .rule-table {
      width: 100%;
      max-width: 360px;
      margin: 0 auto 0.5rem;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    .rule-table td {
      font-family: 'Geosans', sans-serif;
      letter-spacing: 0.06em;
      padding: 0.25rem 0.5rem;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
    }
    .rule-table td:first-child { color: var(--fg); font-weight: 400; }
    .lisp-note { margin-top: 2.5rem; border-top: 1px solid var(--border); padding-top: 1.2rem; }
    .lisp-note summary {
      font-family: 'Geosans', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .lisp-note pre {
      font-family: 'Fira Code', monospace;
      font-size: 0.82rem;
      line-height: 1.7;
      margin-top: 1rem;
      color: var(--muted);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="shared-header"></div>

  <div class="container">
    <main class="sub-main">
      <h1 class="page-title font-kazesawa">変なFizzBuzz</h1>

      <p class="font-kazesawa-light" style="font-size:0.9rem; color:var(--muted); margin-bottom:1rem;">
        FizzBuzzにボルゾイが乱入。このカオスに耐えながら、タイムを縮めろ。
      </p>

      <table class="rule-table">
        <tr><td>3の倍数</td><td>→ Fizz</td></tr>
        <tr><td>5の倍数</td><td>→ Buzz</td></tr>
        <tr><td>7の倍数</td><td>→ Woof</td></tr>
        <tr><td>15の倍数</td><td>→ FizzBuzz</td></tr>
        <tr><td>21の倍数</td><td>→ FizzWoof</td></tr>
        <tr><td>35の倍数</td><td>→ BuzzWoof</td></tr>
        <tr><td>105の倍数</td><td>→ FizzBuzzWoof</td></tr>
        <tr><td>それ以外</td><td>→ 数字</td></tr>
      </table>

      <div class="game-area">
        <div class="score-row">
          正解 <span id="scoreCorrect">0</span> &nbsp;／&nbsp; 問題数 <span id="scoreTotal">0</span>
        </div>
        <div class="timer-row">
          <span id="timerDisplay">—</span> &nbsp;／&nbsp; 最速 <span id="bestTime">—</span>
        </div>

        <div class="number-display font-geosans" id="numberDisplay">…</div>
        <div class="feedback font-kazesawa-light" id="feedback"></div>

        <div class="answer-row">
          <button class="ans-btn" id="btnFizz"         onclick="answer('Fizz')">Fizz</button>
          <button class="ans-btn" id="btnBuzz"         onclick="answer('Buzz')">Buzz</button>
          <button class="ans-btn" id="btnWoof"         onclick="answer('Woof')">Woof</button>
          <button class="ans-btn" id="btnFizzBuzz"     onclick="answer('FizzBuzz')">FizzBuzz</button>
          <button class="ans-btn" id="btnFizzWoof"     onclick="answer('FizzWoof')">FizzWoof</button>
          <button class="ans-btn" id="btnBuzzWoof"     onclick="answer('BuzzWoof')">BuzzWoof</button>
          <button class="ans-btn" id="btnFizzBuzzWoof" onclick="answer('FizzBuzzWoof')">FizzBuzzWoof</button>
          <button class="ans-btn" id="btnNumber"       onclick="answerNumber()">数字</button>
        </div>

        <button class="next-btn font-geosans" id="nextBtn" onclick="nextQuestion()" disabled>次へ →</button>

        <details class="lisp-note">
          <summary>LISPコードを見る (fizzbuzz.scm)</summary>
          <pre id="lispSource">読み込み中…</pre>
        </details>
      </div>

      <a href="index.html" class="back-link font-geosans">← Pastimeへ</a>
    </main>
    <div id="shared-footer"></div>
  </div>

<script>
const WORD_ANSWERS = ['Fizz','Buzz','Woof','FizzBuzz','FizzWoof','BuzzWoof','FizzBuzzWoof'];

const interp = new BiwaScheme.Interpreter();
let currentN = 0;
let correctAnswer = '';
let answered = false;
let scoreCorrect = 0;
let scoreTotal = 0;

let questionStartTime = 0;
let timerInterval = null;
let bestTime = Infinity;

function startTimer() {
  questionStartTime = Date.now();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const s = ((Date.now() - questionStartTime) / 1000).toFixed(1);
    document.getElementById('timerDisplay').textContent = s + 's';
  }, 100);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  const elapsed = (Date.now() - questionStartTime) / 1000;
  document.getElementById('timerDisplay').textContent = elapsed.toFixed(1) + 's';
  if (elapsed < bestTime) {
    bestTime = elapsed;
    document.getElementById('bestTime').textContent = bestTime.toFixed(1) + 's';
  }
}

fetch('fizzbuzz.scm')
  .then(r => r.text())
  .then(code => {
    document.getElementById('lispSource').textContent = code;
    interp.evaluate(code, () => nextQuestion());
  });

function evalFizzBuzz(n, cb) {
  interp.evaluate(`(fizzbuzz ${n})`, result => {
    cb(result instanceof BiwaScheme.Symbol ? result.name : String(result));
  });
}

function nextQuestion() {
  answered = false;
  document.getElementById('feedback').textContent = '';
  document.getElementById('nextBtn').disabled = true;
  document.querySelectorAll('.ans-btn').forEach(b => {
    b.classList.remove('correct', 'wrong');
    b.disabled = false;
  });

  currentN = Math.floor(Math.random() * 300) + 1;
  document.getElementById('numberDisplay').textContent = currentN;

  evalFizzBuzz(currentN, result => {
    correctAnswer = result;
    startTimer();
  });
}

function answer(choice) {
  if (answered) return;
  answered = true;
  stopTimer();
  scoreTotal++;
  document.getElementById('scoreTotal').textContent = scoreTotal;

  const correct = (choice === correctAnswer);
  if (correct) {
    scoreCorrect++;
    document.getElementById('scoreCorrect').textContent = scoreCorrect;
    document.getElementById('feedback').textContent = '正解！';
  } else {
    document.getElementById('feedback').textContent = `不正解。正解は「${correctAnswer}」`;
  }

  document.querySelectorAll('.ans-btn').forEach(b => b.disabled = true);
  document.getElementById('btnFizz').classList.toggle('correct',         correctAnswer === 'Fizz');
  document.getElementById('btnBuzz').classList.toggle('correct',         correctAnswer === 'Buzz');
  document.getElementById('btnWoof').classList.toggle('correct',         correctAnswer === 'Woof');
  document.getElementById('btnFizzBuzz').classList.toggle('correct',     correctAnswer === 'FizzBuzz');
  document.getElementById('btnFizzWoof').classList.toggle('correct',     correctAnswer === 'FizzWoof');
  document.getElementById('btnBuzzWoof').classList.toggle('correct',     correctAnswer === 'BuzzWoof');
  document.getElementById('btnFizzBuzzWoof').classList.toggle('correct', correctAnswer === 'FizzBuzzWoof');
  document.getElementById('btnNumber').classList.toggle('correct',       !WORD_ANSWERS.includes(correctAnswer));
  document.getElementById('nextBtn').disabled = false;
}

function answerNumber() {
  if (answered) return;
  const isNum = !WORD_ANSWERS.includes(correctAnswer);
  answer(isNum ? correctAnswer : '__wrong__');
}
</script>
<script src="../shared-nav.js"></script>
</body>
</html>
